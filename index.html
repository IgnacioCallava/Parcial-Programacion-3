<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catálogo de Productos</title>
        <link rel="stylesheet" href = "./css/index.css"/>
        <script src="./js/script.js" defer></script>
        <link rel="icon" href="./assets/img/logo.png">

    </head>
    <body>
        <header>
        <div class="header-inner">

            <a href="../index.html" class="logo">
            <img src="assets/img/logo.png" alt="Logo" height="52">
            </a>

            <nav>
            <a href="pages/catalogo.html">Catálogo</a>
            </nav>

        </div>
        </header>
        
        <main>
            <!--- "perchero" que muestra los productos -->
            <section id="perchero">
                <h3>Productos Destacados</h3>
                <div class="item" data-categoria="buzos">
                    <img src="assets\img\buzo-adidas-deportivo.jpg" alt="Buzo azul deportivo Adidas">
                    <h3>Buzo Azul deportivo Adidas</h3>
                    <p>Precio: $5500</p>
                    
                </div>
                <div class="item" data-categoria="pantalones">
                    <img src="assets/img/pantalon-puma-urban.png" alt="Pantalón Urban Puma">
                    <h3>Pantalón Urban Puma</h3>
                    <p>Precio: $3000</p>
                </div>
                <div class="item" data-categoria="remeras">
                    <img src="assets\img\remera-nike-urbano.png" alt="Remera Nike">
                    <h3>Remera Nike</h3>
                    <p>Precio: $1200</p>                    
                </div>
                <div class="item" data-categoria="zapatillas">
                    <img src="assets\img\zapatillas-puma-urbanas.png" alt="Zapatillas Urbanas Puma">
                    <h3>Zapatillas Urbanas Puma</h3>
                    <p>Precio: $24000</p>
                </div>
            <!-- más ítems -->
            </section>
        </main>

        <footer>
            <div class="footer-inner">
                <p>Copyright © 2026 "MARCA". Todos los derechos reservados.</p>
                <div>
        </footer>
    </body>
</html>
